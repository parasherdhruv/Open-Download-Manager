name: Supply-chain policy

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history without credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks
        shell: bash
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          tool_dir="$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$tool_dir"
          tar -xzf "$archive" -C "$tool_dir" gitleaks
          "$tool_dir/gitleaks" version
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Scan complete Git history
        run: gitleaks git --redact --no-banner --verbose --log-opts='--all'

  rust-dependencies:
    name: Rust dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Activate repository Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Install verified cargo-deny
        shell: bash
        env:
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
          CARGO_DENY_VERSION: 0.20.2
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-deny.tar.gz"
          tool_dir="$RUNNER_TEMP/cargo-deny"
          curl --fail --silent --show-error --location \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            --output "$archive"
          echo "${CARGO_DENY_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$tool_dir"
          tar -xzf "$archive" --strip-components=1 -C "$tool_dir"
          "$tool_dir/cargo-deny" --version
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Check Rust advisories, licenses, bans, and sources
        run: cargo-deny --locked check advisories bans licenses sources

  javascript-dependencies:
    name: JavaScript dependency policy
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install frozen dependencies without lifecycle scripts
        shell: pwsh
        run: |
          corepack enable
          corepack pnpm --version
          corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: Check high and critical JavaScript advisories
        run: corepack pnpm audit:js

      - name: Check JavaScript dependency licenses
        run: corepack pnpm licenses:js

      - name: Verify lock stability
        shell: pwsh
        run: |
          git diff --exit-code -- pnpm-lock.yaml
          if ($LASTEXITCODE -ne 0) {
            throw 'The pnpm lockfile changed during dependency validation.'
          }

      - name: Remove installed dependencies
        if: ${{ always() }}
        shell: pwsh
        run: |
          foreach ($path in @('node_modules', 'apps/desktop/node_modules', 'apps/browser-extension/node_modules')) {
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force
            }
          }
