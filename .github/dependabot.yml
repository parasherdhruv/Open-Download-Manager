version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:10'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    rebase-strategy: auto
    versioning-strategy: increase

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:20'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    rebase-strategy: auto
    versioning-strategy: increase

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    rebase-strategy: auto
